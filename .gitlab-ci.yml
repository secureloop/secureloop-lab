stages:
  - test
  - build
  - docker

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/demo-apps/java-spring/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE/java-spring

# Cache Maven dependencies
cache:
  paths:
    - demo-apps/java-spring/.m2/repository

# Hidden job to set working directory for Java app
.in_java_app:
  before_script:
    - cd demo-apps/java-spring

# Test stage
test:
  extends: .in_java_app
  stage: test
  image: eclipse-temurin:21-jdk
  script:
    - ./mvnw $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    reports:
      junit:
        - demo-apps/java-spring/target/surefire-reports/TEST-*.xml
    paths:
      - demo-apps/java-spring/target/surefire-reports/
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "web"

# Build JAR stage
build:
  extends: .in_java_app
  stage: build
  image: eclipse-temurin:21-jdk
  script:
    - ./mvnw $MAVEN_CLI_OPTS clean package -DskipTests
  artifacts:
    paths:
      - demo-apps/java-spring/target/*.jar
    expire_in: 90 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "web"

# Build and push Docker image
docker:
  stage: docker
  image: docker:29.0.2
  services:
    - docker:29.0.2-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Build Docker image (context is demo-apps/java-spring)
    - docker build -t $DOCKER_IMAGE:$CI_COMMIT_REF_SLUG demo-apps/java-spring
    - docker build -t $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA demo-apps/java-spring

    # Tag as latest if main branch
    - |
      if [ "$CI_COMMIT_BRANCH" == "main" ]; then
        docker tag $DOCKER_IMAGE:$CI_COMMIT_REF_SLUG $DOCKER_IMAGE:latest
        docker push $DOCKER_IMAGE:latest
      fi

    # Push all tags
    - docker push $DOCKER_IMAGE:$CI_COMMIT_REF_SLUG
    - docker push $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA

    # Display results
    - echo "✅ Docker image built and pushed!"
    - echo "🐳 Image tags:"
    - echo "   - $DOCKER_IMAGE:$CI_COMMIT_REF_SLUG"
    - echo "   - $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" == "main" ]; then
        echo "   - $DOCKER_IMAGE:latest"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "web"
