---
- name: Deploy Docker Environment on Lab Supply Chain
  hosts: lab
  become: true
  gather_facts: true
  vars_files:
    - group_vars/vault.yml

  pre_tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure required packages are installed
      apt:
        name:
          - python3-docker
          - python3-requests
        state: present

  roles:
    - role: docker

