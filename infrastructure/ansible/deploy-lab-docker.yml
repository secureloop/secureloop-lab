---
- name: Deploy Docker Environment on Lab Supply Chain
  hosts: lab_servers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure required packages are installed
      apt:
        name:
          - python3-docker
          - python3-requests
        state: present

  roles:
    - role: docker

  post_tasks:
    - name: Display completion message
      debug:
        msg:
          - "============================================"
          - "Docker environment deployment complete!"
          - "============================================"
          - "Host: {{ inventory_hostname }}"
          - "IP: {{ ansible_host }}"
          - ""
          - "Docker installation verified:"
          - "- Docker Engine: Installed"
          - "- Docker Compose: Installed"
          - ""
          - "Next steps:"
          - "1. Verify Docker installation:"
          - "   ssh {{ ansible_user }}@{{ ansible_host }} 'docker ps'"
          - "2. Test Docker with a simple container:"
          - "   ssh {{ ansible_user }}@{{ ansible_host }} 'docker run hello-world'"
          - "3. Deploy your containerized applications"
          - ""
          - "Note: You may need to log out and back in for docker"
          - "group membership to take effect."
          - "============================================"
