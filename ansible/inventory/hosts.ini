# Ansible Inventory for Secureloop GitLab
# Copy this file to hosts.ini and update with your server IP
# cp hosts.ini.example hosts.ini

[gitlab_servers]
# Replace with your actual server IP from terraform output
# gitlab.secureloop.de ansible_host=YOUR_SERVER_IP

# Example:
gitlab.secureloop.de ansible_host=188.245.182.211

[gitlab_servers:vars]
ansible_user=tonit
ansible_ssh_private_key_file=~/.ssh/id_ed25519_prison
