---
# GitLab Configuration
gitlab_version: "18.3.5-ce.0"
gitlab_hostname: "gitlab.secureloop.de"
gitlab_external_url: "https://{{ gitlab_hostname }}"

# GitLab Ports
gitlab_http_port: 80
gitlab_https_port: 443
gitlab_ssh_port: 2222  # Changed from 22 to avoid conflict with server SSH

# GitLab Storage
gitlab_home: "/opt/gitlab"
gitlab_config_dir: "{{ gitlab_home }}/config"
gitlab_logs_dir: "{{ gitlab_home }}/logs"
gitlab_data_dir: "{{ gitlab_home }}/data"

# Docker Compose
compose_project_name: "secureloop"
compose_file_path: "{{ gitlab_home }}/docker-compose.yml"

# SSL/TLS (optional - set to true to enable Let's Encrypt)
gitlab_enable_letsencrypt: true
gitlab_letsencrypt_email: "toni@rebaze.com"
