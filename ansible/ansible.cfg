[defaults]
inventory = inventory/hosts.ini
host_key_checking = False
remote_user = tonit
private_key_file = ~/.ssh/id_ed25519_prison

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
